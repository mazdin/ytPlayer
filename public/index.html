<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Queue Player — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body class="login-page">
  <div class="login-bg">
    <div class="login-orb orb-1"></div>
    <div class="login-orb orb-2"></div>
    <div class="login-orb orb-3"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">▶</div>
        <h1>YT Queue<span class="accent">Player</span></h1>
      </div>
      <p class="login-subtitle">Nonton YouTube bareng, satu queue, semua sync.</p>

      <form id="loginForm" class="login-form" autocomplete="off">
        <div class="input-group">
          <label for="usernameInput">Nama Pengguna</label>
          <input
            id="usernameInput"
            type="text"
            placeholder="Masukkan nama kamu..."
            maxlength="32"
            autocomplete="off"
            required
          />
        </div>
        <div class="input-group">
          <label for="adminKeyInput">Admin Key (Opsional)</label>
          <input
            id="adminKeyInput"
            type="password"
            placeholder="Kosongkan jika bukan admin..."
            autocomplete="off"
          />
        </div>
        <div id="loginError" class="error-msg hidden"></div>
        <button type="submit" id="loginBtn" class="btn btn-primary btn-full">
          <span class="btn-text">Masuk Sekarang</span>
          <span class="btn-icon">→</span>
        </button>
      </form>

      <div class="login-footer">
        <span class="online-dot"></span>
        <span id="userCountLogin">Sinkronisasi Real-time Aktif</span>
      </div>
    </div>
  </div>

  <script src="https://js.pusher.com/8.0.1/pusher.min.js"></script>
  <script>
    let pusher = null;
    let channel = null;

    // Check service status immediately on page load
    (async () => {
      try {
        const res = await fetch('/api/state');
        const { serviceEnabled } = await res.json();
        if (!serviceEnabled) window.location.replace('/maintenance.html');

        // Init Pusher for real-time maintenance updates
        const configRes = await fetch('/api/config');
        const { pusherKey, pusherCluster } = await configRes.json();
        
        if (pusherKey) {
          pusher = new Pusher(pusherKey, { cluster: pusherCluster });
          channel = pusher.subscribe('yt-player-channel');
          channel.bind('service-status', ({ serviceEnabled }) => {
            if (!serviceEnabled) window.location.replace('/maintenance.html');
          });
        }
      } catch (_) {}
    })();

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const username = document.getElementById('usernameInput').value.trim();
      const adminKey = document.getElementById('adminKeyInput').value.trim();
      if (!username) return;

      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.querySelector('.btn-text').textContent = 'Masuk...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, adminKey })
        });
        const data = await res.json();

        if (res.ok) {
          sessionStorage.setItem('username', data.username);
          sessionStorage.setItem('role', data.role);
          if (adminKey) sessionStorage.setItem('adminKey', adminKey);
          window.location.href = '/player.html';
        } else {
          showError(data.error || 'Gagal login.');
        }
      } catch (err) {
        showError('Gagal terhubung ke server.');
      }
    });

    function showError(msg) {
      const el = document.getElementById('loginError');
      el.textContent = msg;
      el.classList.remove('hidden');
      const btn = document.getElementById('loginBtn');
      btn.disabled = false;
      btn.querySelector('.btn-text').textContent = 'Masuk Sekarang';
    }
  </script>
</body>
</html>
